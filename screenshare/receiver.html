<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Workee Screen Share</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  #status{position:fixed;top:12px;left:12px;padding:6px 12px;border-radius:6px;background:rgba(0,0,0,.6);color:#c9d1d9;font-size:13px;pointer-events:none}
  #full{position:fixed;top:12px;right:12px;padding:6px 12px;border-radius:6px;border:1px solid #30363d;background:rgba(0,0,0,.6);color:#c9d1d9;font-size:13px;cursor:pointer}
  #full:hover{background:#21262d}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="status">waiting for sender</div>
<button id="full">fullscreen</button>
<script>
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
  const statusEl = document.getElementById('status');
  const video = document.getElementById('v');
  let pc = null;
  let ws = null;
  let answered = false;

  function setStatus(text) { statusEl.textContent = text; }

  document.getElementById('full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };

  function connect() {
    answered = false;
    pc = new RTCPeerConnection({ iceServers: ICE });
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=receiver');

    pc.ontrack = (e) => {
      video.srcObject = e.streams[0];
      setStatus('connected');
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') setStatus('connected');
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') setStatus('reconnecting...');
    };
    pc.onicecandidate = (e) => {
      if (e.candidate && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
    };

    ws.onmessage = async (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      try {
        if (msg.type === 'offer' && !answered) {
          answered = true;
          await pc.setRemoteDescription(msg.sdp);
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
        } else if (msg.type === 'ice') {
          await pc.addIceCandidate(msg.candidate);
        } else if (msg.type === 'peer-gone') {
          answered = false;
          setStatus('waiting for sender');
        }
      } catch (err) {}
    };
    ws.onclose = () => setStatus('disconnected');
  }

  connect();
</script>
</body>
</html>
