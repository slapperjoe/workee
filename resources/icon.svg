<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Workee icon — Microsoft-inspired four-tile mark</title>
  <desc>Four rounded tiles (red, green, blue, yellow) in a 2x2 grid inside a dark rounded-square container. Evokes the Microsoft logo without copying it: even gaps between tiles (the Microsoft mark's tiles touch), rounded tile corners, subtle per-tile gradients, and a dark app container.</desc>

  <defs>
    <!-- Container: dark navy vertical gradient, subtle depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4070"/>
      <stop offset="0.55" stop-color="#18294C"/>
      <stop offset="1" stop-color="#0E1B38"/>
    </linearGradient>

    <!-- Per-tile diagonal gradients: light top-left to deep bottom-right -->
    <linearGradient id="tileRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB5A2F"/>
      <stop offset="1" stop-color="#E03E16"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CC936"/>
      <stop offset="1" stop-color="#64A511"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28B6F7"/>
      <stop offset="1" stop-color="#0B8BD1"/>
    </linearGradient>
    <linearGradient id="tileYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCE47"/>
      <stop offset="1" stop-color="#EFA700"/>
    </linearGradient>
  </defs>

  <!-- Outer container -->
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#bg)"/>

  <!--
    2x2 tile grid, centered at 512.
    Grid is 640x640 (margin 152 from container edge on each side).
    Gap between tiles is 128; each tile is 256x256 with rounded corners (rx 56).
  -->
  <g>
    <!-- Top-left: red -->
    <rect x="192" y="192" width="256" height="256" rx="56" fill="url(#tileRed)"/>
    <!-- Top-right: green -->
    <rect x="576" y="192" width="256" height="256" rx="56" fill="url(#tileGreen)"/>
    <!-- Bottom-left: blue -->
    <rect x="192" y="576" width="256" height="256" rx="56" fill="url(#tileBlue)"/>
    <!-- Bottom-right: yellow -->
    <rect x="576" y="576" width="256" height="256" rx="56" fill="url(#tileYellow)"/>
  </g>
</svg>
