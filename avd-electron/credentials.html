<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;font-size:13px}
  .wrap{padding:14px}
  h1{font-size:13px;margin:0 0 4px;color:#c9d1d9;font-weight:600}
  .sub{font-size:11px;color:#6e7681;margin-bottom:8px}
  label{display:block;margin:9px 0 3px;font-size:11px;color:#8b949e}
  input{width:100%;box-sizing:border-box;background:#161b22;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;padding:6px 8px;font-size:13px}
  input:focus{outline:none;border-color:#58a6ff}
  .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
  button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;padding:6px 12px;font-size:12px;cursor:pointer}
  button:hover{background:#30363d}
  button.p{background:#238636;border-color:#238636}
  button.d{color:#f85149}
  #status{font-size:11px;color:#6e7681;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>VM sign-in credentials</h1>
  <div class="sub">Stored encrypted on this machine. Used when a Cloud PC session
  needs its Microsoft re-sign-in.</div>
  <label for="email">Account email (optional)</label>
  <input id="email" type="email" autocomplete="username" placeholder="name@contoso.com">
  <label for="pwd">Microsoft password</label>
  <input id="pwd" type="password" autocomplete="current-password" placeholder="leave blank to keep current">
  <div class="row">
    <button class="d" id="clear">Clear</button>
    <button class="p" id="save">Save</button>
  </div>
  <div id="status"></div>
</div>
<script>
  window.api.onInit(function (d) {
    document.getElementById('email').value = d.email || '';
    document.getElementById('status').textContent = d.hasPassword
      ? 'A password is currently stored (backend: ' + d.backend + ').'
      : 'No password stored yet.';
  });
  document.getElementById('save').onclick = function () {
    window.api.save(document.getElementById('email').value, document.getElementById('pwd').value);
    document.getElementById('pwd').value = '';
    document.getElementById('status').textContent = 'Saved.';
  };
  document.getElementById('clear').onclick = function () {
    window.api.clear();
    document.getElementById('status').textContent = 'Cleared.';
  };
</script>
</body>
</html>
