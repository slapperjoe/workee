<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM Launch Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --success: #3fb950;
    --warning: #d29922;
    --error: #f85149;
    --running: #3fb950;
    --stopped: #8b949e;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }
  .status-dot.online { background: var(--success); }
  .status-dot.offline { background: var(--error); }
  .status-dot.warning { background: var(--warning); }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .tile:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .tile:active { transform: scale(0.98); }
  .tile h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .tile .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .tile .meta span { margin-right: 8px; }
  .tile .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
  }
  .badge.running {
    background: rgba(63,185,80,0.15);
    color: var(--running);
  }
  .badge.stopped {
    background: rgba(139,148,158,0.15);
    color: var(--stopped);
  }
  .badge.unknown {
    background: rgba(210,153,34,0.15);
    color: var(--warning);
  }
  .tile button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .tile button.connect {
    background: var(--accent);
    color: #fff;
  }
  .tile button.connect:hover { opacity: 0.85; }
  .tile button.connect:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .tile button.start {
    background: var(--success);
    color: #fff;
    margin-bottom: 6px;
  }
  .tile button.start:hover { opacity: 0.85; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }
  .panel h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .connection-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .connection-row:last-child { border-bottom: none; }
  .mfa-banner {
    background: rgba(210,153,34,0.1);
    border: 1px solid var(--warning);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .mfa-banner .icon { font-size: 20px; }
  .mfa-banner input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    width: 160px;
  }
  .mfa-banner button {
    padding: 8px 16px;
    background: var(--warning);
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  .error-banner {
    background: rgba(248,81,73,0.1);
    border: 1px solid var(--error);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    color: var(--error);
    font-size: 14px;
  }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .settings label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted); }
  .settings select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .settings-actions { display: flex; align-items: end; gap: 8px; }
  .settings-actions button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; }
  .qr-link { color: var(--accent-hover); word-break: break-all; font-size: 13px; }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .refresh-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .refresh-bar button {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh-bar button:hover { border-color: var(--accent); }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    animation: fadeIn 0.2s;
    z-index: 100;
  }
  .toast.success { background: var(--success); color: #000; }
  .toast.error { background: var(--error); color: #fff; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <h1>VM Launch Dashboard</h1>
  <div class="status-bar" id="statusBar">
    <span id="stateIndicator">Connecting...</span>
  </div>
</header>

<main>
  <div id="mfaBanner" class="mfa-banner" style="display:none">
    <span class="icon">&#x1F510;</span>
    <span>MFA code required:</span>
    <input type="text" id="mfaCode" placeholder="Enter 6-digit code" maxlength="6" autocomplete="one-time-code">
    <button onclick="submitMfa()">Submit</button>
  </div>

  <div id="errorBanner" class="error-banner" style="display:none"></div>

  <div class="panel">
    <h3>Session setup</h3>
    <div class="settings">
      <label>Backend<select id="settingBackend"><option value="avd">Azure Virtual Desktop</option><option value="portal">Azure Portal VMs</option></select></label>
      <label>Remote display<select id="settingResolution"><option value="auto">Match host window</option><option value="desktop">1920 × 1080</option><option value="laptop">1366 × 768</option><option value="hd">1280 × 720</option></select></label>
      <label>Sign-in method<select id="settingMfa"><option value="qr">QR code (preferred)</option><option value="auto">Automatic / interactive</option><option value="manual">Manual code</option></select></label>
      <div class="settings-actions"><button onclick="saveSettings()">Save settings</button></div>
    </div>
    <div id="qrStatus" style="margin-top:12px;display:none"></div>
  </div>

  <div class="refresh-bar">
    <span class="section-title" style="margin-bottom:0;flex:1">Virtual Machines</span>
    <button onclick="refreshVms()" id="refreshBtn">&#x21bb; Refresh</button>
  </div>

  <div class="grid" id="vmGrid">
    <div class="empty-state">
      <div class="icon">&#x1F5B4;</div>
      <p>Loading VMs...</p>
    </div>
  </div>

  <div class="panel">
    <h3>Active Connections</h3>
    <div id="connectionsList">
      <div style="color:var(--text-muted);font-size:13px">No active connections</div>
    </div>
  </div>
</main>

<script>
const API = '';
let pollTimer = null;
let vmCache = [];

function el(id) { return document.getElementById(id); }

// ---------------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------------

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ---------------------------------------------------------------------------
// Session state
// ---------------------------------------------------------------------------

async function refreshState() {
  try {
    const state = await api('/api/state');
    const indicator = el('stateIndicator');
    let dot = '<span class="status-dot offline"></span>';

    if (state.status === 'connected' && state.authenticated) {
      if (state.mfa_pending) {
        dot = '<span class="status-dot warning"></span>';
        el('mfaBanner').style.display = 'flex';
        indicator.innerHTML = dot + ' MFA Required';
      } else {
        dot = '<span class="status-dot online"></span>';
        el('mfaBanner').style.display = 'none';
        indicator.innerHTML = dot +
          ` ${state.backend.toUpperCase()} · ${state.vm_count} VMs · uptime ${fmtUptime(state.uptime_seconds)}`;
      }
    } else if (state.status === 'disconnected') {
      indicator.innerHTML = dot + ' ' + state.message;
    } else {
      indicator.innerHTML = dot + ' Error: ' + (state.message || 'unknown');
    }
  } catch (e) {
    el('stateIndicator').innerHTML =
      '<span class="status-dot offline"></span> Server unreachable';
  }
  refreshMfa();
}

async function refreshMfa() {
  try {
    const mfa = await api('/api/mfa');
    const box = el('qrStatus');
    if (mfa.pending && mfa.method === 'qr' && mfa.qr_login_url) {
      box.style.display = 'block';
      box.innerHTML = 'Scan the QR code to continue: <a class="qr-link" target="_blank" rel="noopener" href="' + escAttr(mfa.qr_login_url) + '">' + escHtml(mfa.qr_login_url) + '</a>';
    } else { box.style.display = 'none'; }
  } catch (e) { /* session may not be started yet */ }
}

function fmtUptime(secs) {
  if (!secs) return '--';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

// ---------------------------------------------------------------------------
// VM listing
// ---------------------------------------------------------------------------

async function refreshVms() {
  const grid = el('vmGrid');
  const btn = el('refreshBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Loading';

  try {
    const data = await api('/api/vms');
    vmCache = data.vms || [];
    renderVms(vmCache);
  } catch (e) {
    grid.innerHTML = `<div class="empty-state">
      <div class="icon" style="color:var(--error)">&#x26A0;</div>
      <p>Failed to load VMs: ${escHtml(e.message)}</p>
    </div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '&#x21bb; Refresh';
  }
}

function renderVms(vms) {
  const grid = el('vmGrid');
  if (!vms || vms.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="icon">&#x1F50D;</div>
      <p>No VMs found. Check your Azure subscription or try a different backend.</p>
    </div>`;
    return;
  }

  grid.innerHTML = vms.map(vm => {
    const powerState = (vm.power_state || 'unknown').toLowerCase();
    const isRunning = powerState === 'running' || powerState === 'powerstate/running';
    let badge = '';
    if (vm.power_state) {
      const cls = isRunning ? 'running' : 'stopped';
      badge = `<span class="badge ${cls}">${vm.power_state}</span>`;
    } else if (vm.kind) {
      badge = `<span class="badge unknown">${vm.kind}</span>`;
    }

    const subtitle = [vm.workspace, vm.location].filter(Boolean).join(' · ');

    return `
    <div class="tile" id="tile-${escAttr(vm.id || vm.name)}">
      <h3>${escHtml(vm.name)}</h3>
      <div class="meta">
        ${badge}
        ${subtitle ? `<span>${escHtml(subtitle)}</span>` : ''}
      </div>
      <button class="connect"
              onclick="handleVmAction('${escAttr(vm.id || vm.name)}', '${escAttr(vm.name)}', '${escAttr(vm.power_state || 'unknown')}')">
        ${!isRunning && vm.power_state ? 'Start &amp; Connect' : 'Connect'}
      </button>
    </div>`;
  }).join('');
}

// ---------------------------------------------------------------------------
// VM actions
// ---------------------------------------------------------------------------

async function handleVmAction(vmId, vmName, powerState) {
  const isRunning = powerState.toLowerCase() === 'running' ||
                    powerState.toLowerCase() === 'powerstate/running';

  if (!isRunning && powerState !== 'unknown') {
    // Start first, then connect
    try {
      await startVm(vmId, vmName);
      showToast(`VM "${vmName}" starting... refresh to check status`, 'success');
    } catch (e) {
      showToast(`Start failed: ${e.message}`, 'error');
      return;
    }
  }

  await connectTo(vmId, vmName);
}

async function startVm(vmId, vmName) {
  return api('/api/start', {
    method: 'POST',
    body: JSON.stringify({ vm_id: vmId }),
  });
}

async function connectTo(vmId, vmName) {
  const tiles = document.querySelectorAll('.tile button.connect');
  tiles.forEach(b => b.disabled = true);

  try {
    const result = await api('/api/connect', {
      method: 'POST',
      body: JSON.stringify({ vm_id: vmId }),
    });
    showToast(`Connected to ${vmName} via ${result.method}`, 'success');
    refreshConnections();
  } catch (e) {
    showToast(`Failed: ${e.message}`, 'error');
    showError(`Connection to "${vmName}" failed: ${e.message}`);
  } finally {
    tiles.forEach(b => b.disabled = false);
  }
}

// ---------------------------------------------------------------------------
// Connections panel
// ---------------------------------------------------------------------------

async function refreshConnections() {
  try {
    const data = await api('/api/connections');
    const list = el('connectionsList');
    const conns = data.connections || [];
    if (conns.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted);font-size:13px">No active connections</div>';
    } else {
      list.innerHTML = conns.map(c => `
        <div class="connection-row">
          <span><strong>${escHtml(c.vm_name)}</strong>
            <span style="color:var(--text-muted);font-size:12px"> · ${c.method}</span>
          </span>
          <span class="badge ${c.is_connected ? 'running' : 'stopped'}">
            ${c.is_connected ? 'Active' : 'Closed'}
          </span>
        </div>
      `).join('');
    }
  } catch (e) {
    // ignore
  }
}

// ---------------------------------------------------------------------------
// MFA
// ---------------------------------------------------------------------------

async function submitMfa() {
  const code = el('mfaCode').value.trim();
  if (!code || code.length < 4) return;
  try {
    await api('/api/mfa', {
      method: 'POST',
      body: JSON.stringify({ code }),
    });
    el('mfaBanner').style.display = 'none';
    el('mfaCode').value = '';
    showToast('MFA code submitted', 'success');
    refreshState();
  } catch (e) {
    showToast(`MFA failed: ${e.message}`, 'error');
  }
}

async function loadSettings() {
  try {
    const cfg = await api('/api/config');
    el('settingBackend').value = cfg.default_backend || 'avd';
    el('settingResolution').value = cfg.resolution || 'auto';
    el('settingMfa').value = cfg.mfa_method || 'qr';
  } catch (e) { showError('Could not load saved settings: ' + e.message); }
}

async function saveSettings() {
  try {
    const current = await api('/api/config');
    current.default_backend = el('settingBackend').value;
    current.resolution = el('settingResolution').value;
    current.mfa_method = el('settingMfa').value;
    await api('/api/config', { method: 'POST', body: JSON.stringify(current) });
    showToast('Settings saved. Restart the session to apply them.', 'success');
  } catch (e) { showToast('Could not save settings: ' + e.message, 'error'); }
}

// ---------------------------------------------------------------------------
// Toast / errors
// ---------------------------------------------------------------------------

function showToast(msg, cls) {
  const toast = document.createElement('div');
  toast.className = `toast ${cls}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function showError(msg) {
  const banner = el('errorBanner');
  banner.textContent = msg;
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 8000);
}

// ---------------------------------------------------------------------------
// Utils
// ---------------------------------------------------------------------------

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

function init() {
  loadSettings();
  refreshState();
  refreshVms();
  refreshConnections();
  reportViewport();
  pollTimer = setInterval(() => {
    refreshState();
    refreshConnections();
  }, 10000);
}

// ---------------------------------------------------------------------------
// Resolution auto-detect
// ---------------------------------------------------------------------------

function reportViewport() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w > 0 && h > 0) {
    api('/api/resolution', {
      method: 'POST',
      body: JSON.stringify({ width: w, height: h }),
    }).catch(() => { /* best-effort */ });
  }
}

// Re-report on resize (debounced)
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(reportViewport, 500);
});

init();
</script>

</body>
</html>
