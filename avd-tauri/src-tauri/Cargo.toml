[package]
name = "avd-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "avd_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
